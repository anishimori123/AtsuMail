<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1e1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AtsuMail</title>
<link rel="stylesheet" href="style.css?v=0.5.3">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
  <!-- Top toolbar (like Explorer's address bar) -->
  <div id="toolbar">
    <button id="btnFolders" title="Folders">&#9776;</button>
    <button id="btnBack" title="Back" hidden>&larr;</button>
    <span id="path">AtsuMail</span>
    <span class="spacer"></span>
    <button id="btnRefresh" title="Refresh">&#8635;</button>
    <button id="btnSignIn">Sign in</button>
  </div>

  <div id="main">
    <!-- Left: folder tree (Gmail labels) -->
    <nav id="folders"></nav>
    <div class="split" id="split1" title="Drag to resize (double-click to reset)"></div>

    <!-- Middle: message list -->
    <section id="list">
      <div class="row head"><span class="c-from">From</span><span class="c-subj">Subject</span><span class="c-date">Date</span></div>
      <div id="rows"></div>
      <button id="btnMore" hidden>Load more</button>
    </section>

    <div class="split" id="split2" title="Drag to resize (double-click to reset)"></div>

    <!-- Reader: takes the whole screen on phones -->
    <section id="reader" hidden>
      <div id="metabar">
        <button id="btnBack2" title="Back">&larr;</button>
        <div id="meta"></div>
        <button id="btnSpeak" title="Read aloud in Text Reader">&#x1F50A;</button>
        <button id="btnSmaller" title="Smaller text">A-</button>
        <button id="btnBigger" title="Bigger text">A+</button>
        <button id="btnRead" title="Reading mode: dark, clean text">Aa</button>
        <button id="btnFull" title="Full screen">&#x26F6;</button>
      </div>
      <iframe id="body" sandbox="allow-popups allow-popups-to-escape-sandbox" title="Email"></iframe>
      <div id="edge"></div>
      <div id="edgeR"></div>
      <button id="btnExitFull" title="Exit full screen">&#x2715;</button>
    </section>
  </div>

  <div id="status">Ready</div>

  <script src="config.js?v=0.5.3"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="demo.js?v=0.5.3"></script>
  <script src="app.js?v=0.5.3"></script>
</body>
</html>
