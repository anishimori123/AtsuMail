<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1e1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AtsuMail</title>
<link rel="stylesheet" href="style.css?v=0.10.0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
  <!-- Top toolbar (like Explorer's address bar) -->
  <div id="toolbar">
    <button id="btnFolders" title="Folders">&#9776;</button>
    <button id="btnBack" title="Back" hidden>&larr;</button>
    <span id="path">AtsuMail</span>
    <span class="spacer"></span>
    <button id="btnRefresh" title="Refresh">&#8635;</button>
    <button id="btnSignIn">Sign in</button>
  </div>

  <div id="main">
    <!-- Left: folder tree (Gmail labels) -->
    <nav id="folders"></nav>
    <div class="split" id="split1" title="Drag to resize (double-click to reset)"></div>

    <!-- Middle: message list -->
    <section id="list">
      <div class="row head"><span class="c-from">From</span><span class="c-subj">Subject</span><span class="c-date">Date</span></div>
      <div id="rows"></div>
      <button id="btnMore" hidden>Load more</button>
    </section>

    <div class="split" id="split2" title="Drag to resize (double-click to reset)"></div>

    <!-- Reader: takes the whole screen on phones -->
    <section id="reader" hidden>
      <div id="metabar">
        <button id="btnBack2" title="Back">&larr;</button>
        <div id="meta"></div>
        <button id="btnSpeak" title="Read aloud">&#x1F50A;</button>
        <button id="btnSmaller" title="Smaller text">A-</button>
        <button id="btnBigger" title="Bigger text">A+</button>
        <button id="btnRead" title="Reading mode: dark, clean text">Aa</button>
        <button id="btnFull" title="Full screen (F)">&#x26F6;</button>
      </div>
      <iframe id="body" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox" title="Email"></iframe>
      <!-- Voice player (reads the email aloud) -->
      <div id="player" hidden>
        <div id="vProg"><div id="vBar"></div></div>
        <div class="vrow">
          <button id="vPrev" title="Previous sentence">&#9198;</button>
          <button id="vPlay" title="Play">&#9654;</button>
          <button id="vNext" title="Next sentence">&#9197;</button>
          <button id="vStop" title="Stop">&#9632;</button>
          <select id="vStyle" title="Reading style"></select>
          <button id="vSlower" title="Slower">&minus;</button><span id="vSpeed">1.0x</span><button id="vFaster" title="Faster">+</button>
          <span class="spacer"></span>
          <button id="vTR" title="Open in Text Reader app">&#8599;</button>
          <button id="vClose" title="Close player">&#x2715;</button>
        </div>
        <div class="vrow">
          <label>EN <select id="vEn"></select></label>
          <label>JA <select id="vJa"></select></label>
        </div>
        <div id="vNow"></div>
      </div>
      <div id="edge"></div>
      <div id="edgeR"></div>
      <button id="btnExitFull" title="Exit full screen">&#x2715;</button>
    </section>

    <!-- Watch later: saved YouTube videos and links -->
    <section id="watchview" hidden>
      <div id="wmain">
        <div class="wbar">
          <input id="wurl" type="url" placeholder="Paste a YouTube or any link" autocomplete="off">
          <input id="wname" type="text" placeholder="Title (optional)" autocomplete="off">
          <button id="wadd">Add</button>
        </div>
        <div id="wlist"></div>
      </div>
      <div id="wplayer" hidden>
        <div class="wbar">
          <button id="wback" title="Back to list">&larr;</button>
          <span id="wtitle"></span>
          <a id="wopen" target="_blank" rel="noopener" title="Open on YouTube">YouTube &#8599;</a>
          <button id="wfull" title="Full screen (F)">&#x26F6;</button>
        </div>
        <iframe id="wframe" title="Video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>
    </section>

    <!-- Google Sheet view (read-only) -->
    <section id="sheetview" hidden>
      <div id="sheetgrid"></div>
      <div id="sheetbar">
        <div id="sheettabs"></div>
        <button id="btnSheetFull" title="Full screen (F)">&#x26F6;</button>
      </div>
    </section>
  </div>

  <div id="toast" hidden></div>
  <div id="status">Ready</div>

  <script src="config.js?v=0.10.0"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="demo.js?v=0.10.0"></script>
  <script src="voice.js?v=0.10.0"></script>
  <script src="app.js?v=0.10.0"></script>
</body>
</html>
